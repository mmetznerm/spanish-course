<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Language Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">LANGUAGE GYM</div>
        <h1>Frases para treinar inglês e espanhol.</h1>
      </div>
      <div class="counter" id="counter">1 / 110</div>
    </header>

    <section class="card" aria-live="polite">
      <div class="topic" id="topic">Saudações</div>

      <div class="language-block pt">
        <div class="label"><span>🇧🇷</span> Português</div>
        <p id="pt">Olá! Como você está?</p>
      </div>

      <div class="divider"></div>

      <div class="language-block en">
        <div class="label"><span>🇺🇸</span> English</div>
        <p id="en">Hi! How are you?</p>
      </div>

      <div class="divider"></div>

      <div class="language-block es">
        <div class="label"><span>🇪🇸</span> Español</div>
        <p id="es">¡Hola! ¿Cómo estás?</p>
      </div>
    </section>

    <nav class="controls" aria-label="Navegação das frases">
      <button class="secondary" id="prev" type="button">← Anterior</button>
      <button class="primary" id="next" type="button">Próxima →</button>
    </nav>

    <footer>
      <span id="source">Fonte: mapas1-p01-q2-saudacoes-em-espanhol.webp</span>
      <span>Use ← → do teclado para navegar.</span>
    </footer>
  </main>
  <script src="data/phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
